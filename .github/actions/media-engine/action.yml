name: MpVFX media engine and Rust cache
description: Restores or downloads the pinned media engine and restores the Rust build cache.
inputs:
  rust-cache-key:
    description: Name of this job's Rust build cache.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: third_party/mpvfx-media
        key: mpvfx-media-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-media-engine.sh') }}
    - shell: bash
      run: bash scripts/prepare-media-engine.sh
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend
        shared-key: ${{ inputs.rust-cache-key }}
