name: Set up macOS
description: Selects the newest installed Xcode 27 (no sudo, so it works on a self-hosted Mac); optionally requires a Metal GPU.
inputs:
  require-gpu:
    description: Fail unless Metal reports a GPU (for the GPU jobs).
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # The newest installed Xcode 27, whatever its folder is called (Xcode_27.x.app on GitHub's machines,
        # Xcode.app or Xcode-beta.app on a self-hosted Mac). DEVELOPER_DIR selects it for this job without sudo.
        # Read the whole version output: piping xcodebuild into head makes it crash on the closed pipe.
        best='' best_version=''
        for app in /Applications/Xcode*.app; do
          tool="$app/Contents/Developer/usr/bin/xcodebuild"
          [[ -x $tool ]] || continue
          version=$("$tool" -version 2>/dev/null) || continue
          version=${version%%$'\n'*}
          if [[ $version == 'Xcode 27'* ]] && [[ -z $best || $(printf '%s\n%s\n' "$best_version" "$version" | sort -V | tail -n 1) == "$version" ]]; then
            best=$app best_version=$version
          fi
        done
        if [[ -z $best ]]; then
          echo "::error::Xcode 27 is required; none was found in /Applications."
          exit 1
        fi
        echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
        echo "$best_version ($best)"
    - if: inputs.require-gpu == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/gpu.swift" <<'SWIFT'
        import Metal
        guard let device = MTLCreateSystemDefaultDevice() else { print("no Metal device"); exit(1) }
        print("Metal GPU: \(device.name), unified memory \(device.hasUnifiedMemory), " +
              "max working set \(device.recommendedMaxWorkingSetSize / 1_048_576) MB")
        SWIFT
        xcrun swiftc "$RUNNER_TEMP/gpu.swift" -o "$RUNNER_TEMP/gpu"
        echo "::notice::$("$RUNNER_TEMP/gpu")"
