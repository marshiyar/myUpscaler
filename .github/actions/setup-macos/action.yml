name: Set up macOS
description: Selects the newest installed Xcode 27; optionally requires a Metal GPU.
inputs:
  require-gpu:
    description: Fail unless Metal reports a GPU (for the GPU jobs).
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        xcode_app=$(find /Applications -maxdepth 1 -name 'Xcode_27*.app' | sort -V | tail -n 1)
        if [[ -n "$xcode_app" ]]; then
          sudo xcode-select --switch "$xcode_app/Contents/Developer"
        fi
        # The xcode-27 image's default Xcode is 27; anything else means the wrong image.
        version=$(xcodebuild -version | head -n 1)
        echo "$version"
        if [[ $version != 'Xcode 27'* ]]; then
          echo "::error::Xcode 27 is required; this runner has $version."
          exit 1
        fi
    - if: inputs.require-gpu == 'true'
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/gpu.swift" <<'SWIFT'
        import Metal
        guard let device = MTLCreateSystemDefaultDevice() else { print("no Metal device"); exit(1) }
        print("Metal GPU: \(device.name), unified memory \(device.hasUnifiedMemory), " +
              "max working set \(device.recommendedMaxWorkingSetSize / 1_048_576) MB")
        SWIFT
        xcrun swiftc "$RUNNER_TEMP/gpu.swift" -o "$RUNNER_TEMP/gpu"
        echo "::notice::$("$RUNNER_TEMP/gpu")"
