version: 2
updates:
  # One grouped pull request a week per area, so updates never pile up.
  - package-ecosystem: cargo
    directories: ["/backend", "/desktop", "/gpu"]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
