name: Desktop app

on:
  pull_request:
    paths: &desktop-paths
      - 'desktop/**'
      - 'backend/**'
      - 'rust-toolchain.toml'
      - 'scripts/prepare-media-engine.sh'
      - '.github/actions/media-engine/**'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths: *desktop-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  linux:
    # Format, lints and tests, then screenshots of the real window (light, dark, filtered preview, a finished run)
    # rendered headless with Slint's software renderer, kept as an artifact for review.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: System libraries for the interface (fonts)
        run: sudo apt-get update -q && sudo apt-get install -y -q libfontconfig1-dev
      - uses: ./.github/actions/media-engine
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop, shared-key: desktop-linux }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Screenshots
        run: |
          set -euo pipefail
          cargo build --release
          app=target/release/myupscaler
          shots="$RUNNER_TEMP/screenshots"
          mkdir -p "$shots"
          python3 scripts/sample-image.py "$shots/sample.png"
          "$app" --screenshot "$shots/import.png"
          "$app" --screenshot "$shots/edit-restore-dark.png" --dark --page 1 "$shots/sample.png"
          "$app" --screenshot "$shots/edit-processor-filtered.png" --processed --page 2 "$shots/sample.png"
          "$app" --screenshot "$shots/export-light.png" --light --workspace 2 "$shots/sample.png"
          "$app" --screenshot "$shots/finished-run.png" --run "$shots/sample.png"
          test -s "$shots/sample_[restored].png"
          cargo run --release --example sample_clip -- "$shots/clip.mp4"
          "$app" --screenshot "$shots/video-light.png" --light --processed --page 1 "$shots/clip.mp4"
          "$app" --screenshot "$shots/video-running.png" --dark --workspace 2 --run --after 5 "$shots/clip.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: error

  windows:
    # Tests, then a real run of the release build (a generated clip, processed headless), so the shipped app is known
    # to process files. The artifact is the app with the media engine's DLL beside it.
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/media-engine
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop, shared-key: desktop-windows }
      - run: cargo test
      - name: Build and process a clip
        run: |
          set -euo pipefail
          cargo build --release
          test -f target/release/mpvfx_ffi.dll
          shots="$RUNNER_TEMP/screenshots"
          mkdir -p "$shots"
          cargo run --release --example sample_clip -- "$shots/clip.mp4"
          target/release/myupscaler.exe --screenshot "$shots/windows-finished-run.png" --run "$shots/clip.mp4"
          test -s "$shots/clip_[restored].mp4"
          mkdir -p "$RUNNER_TEMP/app"
          cp target/release/myupscaler.exe target/release/mpvfx_ffi.dll ../third_party/mpvfx-media/LICENSE \
            ../third_party/mpvfx-media/NOTICE "$RUNNER_TEMP/app/"
      - uses: actions/upload-artifact@v4
        with:
          name: myupscaler-windows-x64
          path: ${{ runner.temp }}/app/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-screenshot
          path: ${{ runner.temp }}/screenshots/windows-finished-run.png

  macos:
    # The self-hosted Mac. Pull requests from forks never run on it: their code would run on that machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/media-engine
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop, shared-key: desktop-macos }
      - run: cargo test
      - name: Build and render a finished run
        run: |
          set -euo pipefail
          cargo build --release
          shots="$RUNNER_TEMP/screenshots"
          mkdir -p "$shots"
          python3 scripts/sample-image.py "$shots/sample.png"
          target/release/myupscaler --screenshot "$shots/macos-finished-run.png" --run "$shots/sample.png"
          test -s "$shots/sample_[restored].png"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-screenshot
          path: ${{ runner.temp }}/screenshots/macos-finished-run.png
