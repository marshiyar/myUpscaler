name: Desktop app

on:
  pull_request:
    paths: &desktop-paths
      - 'desktop/**'
      - 'backend/**'
      - 'gpu/**'
      - 'rust-toolchain.toml'
      - 'scripts/fetch-sample-clip.sh'
      - 'scripts/prepare-media-engine.sh'
      - '.github/workflows/release.yml'
      - '.github/actions/media-engine/**'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths: *desktop-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  linux:
    # Format, lints and tests, then screenshots of the real window (light, dark, each adjustments page, a finished run)
    # rendered headless with Slint's software renderer, kept as an artifact for review.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: System libraries for the interface (fonts) and the player (ALSA)
        run: sudo apt-get update -q && sudo apt-get install -y -q libfontconfig1-dev libasound2-dev
      - uses: ./.github/actions/media-engine
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop, shared-key: desktop-linux }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Screenshots
        run: |
          set -euo pipefail
          cargo build --release
          app=target/release/myupscaler
          shots="$RUNNER_TEMP/screenshots"
          mkdir -p "$shots"
          python3 scripts/sample-image.py "$shots/sample.png"
          "$app" --screenshot "$shots/import.png"
          "$app" --screenshot "$shots/restore-dark.png" --dark --page 1 "$shots/sample.png"
          "$app" --screenshot "$shots/processor-light.png" --light --page 2 "$shots/sample.png"
          "$app" --screenshot "$shots/output-dark.png" --dark --page 3 "$shots/sample.png"
          "$app" --screenshot "$shots/settings-light.png" --light --settings
          "$app" --screenshot "$shots/finished-run.png" --run --log "$shots/sample.png"
          test -s "$shots/sample_[restored].png"
          cargo run --release --example sample_clip -- "$shots/clip.mp4"
          bash ../scripts/fetch-sample-clip.sh "$shots/onepiece_demo.mp4"
          "$app" --screenshot "$shots/video-light.png" --light --page 0 "$shots/onepiece_demo.mp4"
          "$app" --screenshot "$shots/video-running.png" --dark --inspector --run --after 5 "$shots/clip.mp4"
      - name: Package
        run: |
          set -euo pipefail
          bash scripts/package.sh linux myupscaler-linux-x64 "$RUNNER_TEMP/package"
          bash scripts/check-package.sh "$RUNNER_TEMP/package/myupscaler-linux-x64.tar.gz" "$RUNNER_TEMP/package-check"
      - uses: actions/upload-artifact@v7
        with:
          name: myupscaler-linux-x64
          path: ${{ runner.temp }}/package/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/media-engine
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop, shared-key: desktop-windows }
      - run: cargo test
      - run: cargo build --release
      - name: Package and run from the unpacked folder
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package.sh windows myupscaler-windows-x64 "$RUNNER_TEMP/package"
          bash scripts/check-package.sh "$RUNNER_TEMP/package/myupscaler-windows-x64.zip" "$RUNNER_TEMP/package-check"
      - uses: actions/upload-artifact@v7
        with:
          name: myupscaler-windows-x64
          path: ${{ runner.temp }}/package/*.zip
          if-no-files-found: error

  macos:
    # The self-hosted Mac. Pull requests from forks never run on it: their code would run on that machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ./.github/actions/media-engine
      # Kept outside the checkout (wiped on every run) and per runner, so a cancelled run's leftover cargo cannot lose its files; a later cargo waits on the lock instead.
      - run: echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/../../.cargo-target/$RUNNER_NAME" >> "$GITHUB_ENV"
      - run: cargo test
      - name: Build and render a finished run
        run: |
          set -euo pipefail
          cargo build --release
          shots="$RUNNER_TEMP/screenshots"
          mkdir -p "$shots"
          python3 scripts/sample-image.py "$shots/sample.png"
          "$CARGO_TARGET_DIR/release/myupscaler" --screenshot "$shots/macos-finished-run.png" --run "$shots/sample.png"
          test -s "$shots/sample_[restored].png"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-screenshot
          path: ${{ runner.temp }}/screenshots/macos-finished-run.png
