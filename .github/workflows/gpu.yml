name: GPU stages

on:
  pull_request:
    paths: &gpu-paths
      - 'gpu/**'
      - 'backend/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/gpu.yml'
  push:
    branches: [main]
    paths: *gpu-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: gpu

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Software Vulkan driver
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: gpu, shared-key: "gpu-${{ matrix.os }}" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
