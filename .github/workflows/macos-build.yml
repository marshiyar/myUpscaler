name: macOS build, test and bundle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      model_archive_url:
        description: 'Optional HTTPS ZIP of externally prepared .mlmodelc folders at archive root'
        required: false
        type: string
      model_archive_sha256:
        description: 'SHA-256 of the supplied model ZIP (required when a URL is supplied)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      COREML_MODEL_ARCHIVE_URL: ${{ inputs.model_archive_url || '' }}
      COREML_MODEL_ARCHIVE_SHA256: ${{ inputs.model_archive_sha256 || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          # This project uses Xcode 26 Swift build settings. Select the newest
          # installed Xcode 26 rather than relying on the runner's default.
          xcode_app=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)
          if [[ -z "$xcode_app" ]]; then
            echo '::error::This runner image does not have Xcode 26 installed.'
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Prepare bundled FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          status=0
          bash scripts/prepare-bundled-ffmpeg.sh > "$RUNNER_TEMP/ffmpeg-preparation.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/ffmpeg-preparation.log"
          if [[ $status -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/ffmpeg-preparation.log" <<'PY'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text()[-8000:]
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit "$status"
          fi

      - name: Prepare bundled CoreML models
        shell: bash
        run: |
          set -euo pipefail
          status=0
          bash scripts/prepare-bundled-models.sh > "$RUNNER_TEMP/model-preparation.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/model-preparation.log"
          if [[ $status -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/model-preparation.log" <<'PYLOG'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text()[-8000:]
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
            exit "$status"
          fi

      - name: Test externally supplied model sets
        shell: bash
        run: |
          set -euo pipefail
          saved="$RUNNER_TEMP/prebuilt-models"
          single="$RUNNER_TEMP/single-model"
          unpacked="$RUNNER_TEMP/model-archive"
          ditto third_party/CoreML "$saved"
          # Use a subset of real prebuilt models to exercise cache replacement,
          # optional model selection, and the documented external ZIP layout.
          mkdir -p "$single" "$unpacked"
          selected=$(find "$saved" -maxdepth 1 -name '*.mlmodelc' -type d | sort | head -n 1)
          test -n "$selected"
          ditto "$selected" "$single/$(basename "$selected")"
          ditto -c -k "$single" "$RUNNER_TEMP/prebuilt-models.zip"
          ditto -x -k "$RUNNER_TEMP/prebuilt-models.zip" "$unpacked"
          COREML_MODEL_ARCHIVE_URL= COREML_MODEL_ARCHIVE_SHA256= \
            COREML_MODELS_DIR="$unpacked" bash scripts/prepare-bundled-models.sh
          count=$(find third_party/CoreML -maxdepth 1 -name '*.mlmodelc' -type d | wc -l | tr -d ' ')
          test "$count" = 1
          test -d "third_party/CoreML/$(basename "$selected")"
          # Missing transport checksums must fail even if a valid cache exists.
          if COREML_MODELS_DIR= COREML_MODEL_ARCHIVE_SHA256= \
              COREML_MODEL_ARCHIVE_URL=https://example.invalid/models.zip \
              bash scripts/prepare-bundled-models.sh; then
            echo '::error::A model download without a checksum was accepted.'
            exit 1
          fi
          COREML_MODEL_ARCHIVE_URL= COREML_MODEL_ARCHIVE_SHA256= \
            COREML_MODELS_DIR="$saved" bash scripts/prepare-bundled-models.sh
          diff -qr "$saved" third_party/CoreML
          echo '::notice::External prebuilt model ZIP/directory, cache replacement and checksum requirement passed.'

      - name: Test bundled engine lifecycle and architecture
        run: python3 -m unittest discover -s tests -p 'test_bundled_ffmpeg*.py'

      - name: Test upscaling mode availability
        run: |
          set -euo pipefail
          xcrun swiftc myUpscaler/UpscalingModeSupport.swift tests/upscaling-mode-support/main.swift \
            -o "$RUNNER_TEMP/upscaling-mode-tests"
          "$RUNNER_TEMP/upscaling-mode-tests"

      - name: Build Debug app
        shell: bash
        run: |
          set -euo pipefail
          status=0
          xcodebuild \
            -project myUpscaler.xcodeproj \
            -scheme myUpscaler \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/myUpscaler-DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build > "$RUNNER_TEMP/myUpscaler-build.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/myUpscaler-build.log"
          if [[ $status -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/myUpscaler-build.log" <<'PYLOG'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text()[-8000:]
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
            exit "$status"
          fi

      - name: Run XCTest unit tests
        shell: bash
        run: |
          set -euo pipefail
          status=0
          xcodebuild \
            -project myUpscaler.xcodeproj \
            -scheme myUpscaler \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/myUpscaler-DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/myUpscaler-UnitTests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            test > "$RUNNER_TEMP/myUpscaler-unit-tests.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/myUpscaler-unit-tests.log"
          if [[ $status -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/myUpscaler-unit-tests.log" <<'PYLOG'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text()[-8000:]
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
            exit "$status"
          fi

          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/myUpscaler-UnitTests.xcresult" > "$RUNNER_TEMP/unit-test-summary.json"
          python3 - "$RUNNER_TEMP/unit-test-summary.json" <<'PYSUMMARY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          passed, failed = summary.get('passedTests', 0), summary.get('failedTests', 0)
          assert passed >= 8 and failed == 0, summary
          print(f'::notice::XCTest: {passed} passed, {failed} failed.')
          PYSUMMARY

      - name: Verify packaged CoreML models and inference
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/myUpscaler-DerivedData/Build/Products/Debug/myUpscaler.app"
          cmp myUpscaler/ThirdParty/RealESRGAN-LICENSE.txt "$app/Contents/Resources/RealESRGAN-LICENSE.txt"
          status=0
          bash scripts/validate-bundled-models.sh "$app" --predict \
            > "$RUNNER_TEMP/model-verification.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/model-verification.log"
          if [[ $status -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/model-verification.log" <<'PYLOG'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text()[-8000:]
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
            exit "$status"
          fi

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/myUpscaler-DerivedData/Build/Products/Debug/myUpscaler.app"
          for executable in "$app/Contents/MacOS/myUpscaler" \
              "$app/Contents/MacOS/up60p-ffmpeg-supervisor" \
              "$app/Contents/MacOS/ThirdParty/FFmpeg/ffmpeg"; do
            test -x "$executable"
            if [[ $(xcrun lipo -archs "$executable") != arm64 ]]; then
              echo "::error::Expected arm64-only app executable: $executable"
              exit 1
            fi
          done
          test -x "$app/Contents/MacOS/up60p-ffmpeg-supervisor"
          codesign --verify --strict "$app/Contents/MacOS/up60p-ffmpeg-supervisor"
          test -x "$app/Contents/MacOS/ThirdParty/FFmpeg/ffmpeg"
          codesign --verify --strict "$app/Contents/MacOS/ThirdParty/FFmpeg/ffmpeg"
          codesign --verify --strict "$app"
          status=0
          bash tests/verify-packaged-ffmpeg.sh "$app" > "$RUNNER_TEMP/ffmpeg-verification.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/ffmpeg-verification.log"
          if [[ $status -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/ffmpeg-verification.log" <<'PY'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text()[-8000:]
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit "$status"
          fi
          # Verifies FFmpeg packaging and a sandboxed launch; GUI use needs manual checks.

      - name: Build Release app
        shell: bash
        run: |
          set -euo pipefail
          status=0
          xcodebuild \
            -project myUpscaler.xcodeproj -scheme myUpscaler \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/myUpscaler-DerivedData" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build > "$RUNNER_TEMP/myUpscaler-release-build.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/myUpscaler-release-build.log"
          if [[ $status -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/myUpscaler-release-build.log" <<'PYLOG'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text()[-8000:]
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
            exit "$status"
          fi

      - name: Verify Release FFmpeg render and cancellation
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/myUpscaler-DerivedData/Build/Products/Release/myUpscaler.app"
          bash tests/verify-packaged-ffmpeg.sh "$app"

      - name: Package and verify delivered app
        id: package-app
        shell: bash
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          status=0
          app="$RUNNER_TEMP/myUpscaler-DerivedData/Build/Products/Release/myUpscaler.app"
          bash scripts/package-app.sh "$app" "$RUNNER_TEMP/myUpscaler-delivery" \
            > "$RUNNER_TEMP/myUpscaler-packaging.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/myUpscaler-packaging.log"
          if [[ $status -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/myUpscaler-packaging.log" <<'PYLOG'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text()[-8000:]
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
            exit "$status"
          fi

      - name: Preserve delivered app artifact
        id: delivered-app
        if: always() && steps.package-app.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: myUpscaler-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/myUpscaler-delivery/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Link delivered app in run summary
        if: steps.delivered-app.outcome == 'success'
        env:
          APP_ARTIFACT_URL: ${{ steps.delivered-app.outputs.artifact-url }}
        run: |
          echo "[Download the bundled Release app (ZIP and DMG)]($APP_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Ad hoc signed; not notarized. Retained for 90 days. No GitHub Release is published.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: |
            ${{ runner.temp }}/myUpscaler-build.log
            ${{ runner.temp }}/myUpscaler-release-build.log
            ${{ runner.temp }}/myUpscaler-packaging.log
            ${{ runner.temp }}/model-verification.log
            ${{ runner.temp }}/model-preparation.log
          if-no-files-found: ignore

      - name: Upload XCTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-unit-test-results
          path: |
            ${{ runner.temp }}/myUpscaler-unit-tests.log
            ${{ runner.temp }}/unit-test-summary.json
            ${{ runner.temp }}/myUpscaler-UnitTests.xcresult
          if-no-files-found: ignore
