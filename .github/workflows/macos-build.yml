name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          # This project uses Xcode 26 Swift build settings. Select the newest
          # installed Xcode 26 rather than relying on the runner's default.
          xcode_app=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n 1)
          if [[ -z "$xcode_app" ]]; then
            echo '::error::This runner image does not have Xcode 26 installed.'
            exit 1
          fi
          sudo xcode-select --switch "$xcode_app/Contents/Developer"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Prepare bundled FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          status=0
          bash scripts/prepare-bundled-ffmpeg.sh > "$RUNNER_TEMP/ffmpeg-preparation.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/ffmpeg-preparation.log"
          if [[ $status -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/ffmpeg-preparation.log" <<'PY'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text()[-8000:]
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit "$status"
          fi

      - name: Test bundled engine lifecycle and architecture
        run: python3 -m unittest discover -s tests -p 'test_bundled_ffmpeg*.py'

      - name: Test upscaling mode availability
        run: |
          set -euo pipefail
          xcrun swiftc myUpscaler/UpscalingModeSupport.swift tests/upscaling-mode-support/main.swift \
            -o "$RUNNER_TEMP/upscaling-mode-tests"
          "$RUNNER_TEMP/upscaling-mode-tests"

      - name: Build Debug app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project myUpscaler.xcodeproj \
            -scheme myUpscaler \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/myUpscaler-DerivedData" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build 2>&1 | tee "$RUNNER_TEMP/myUpscaler-build.log"

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/myUpscaler-DerivedData/Build/Products/Debug/myUpscaler.app"
          test -x "$app/Contents/MacOS/myUpscaler"
          test -x "$app/Contents/MacOS/up60p-ffmpeg-supervisor"
          xcrun lipo "$app/Contents/MacOS/up60p-ffmpeg-supervisor" -verify_arch arm64 x86_64
          codesign --verify --strict "$app/Contents/MacOS/up60p-ffmpeg-supervisor"
          test -x "$app/Contents/MacOS/ThirdParty/FFmpeg/ffmpeg"
          test -f "$app/Contents/Resources/FFmpeg-COPYING.txt"
          test -f "$app/Contents/Resources/FFmpeg-NOTICE.txt"
          xcrun lipo "$app/Contents/MacOS/ThirdParty/FFmpeg/ffmpeg" -verify_arch arm64 x86_64
          codesign --verify --strict "$app/Contents/MacOS/ThirdParty/FFmpeg/ffmpeg"
          codesign --verify --strict "$app"
          status=0
          bash tests/verify-packaged-ffmpeg.sh "$app" > "$RUNNER_TEMP/ffmpeg-verification.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/ffmpeg-verification.log"
          if [[ $status -ne 0 ]]; then
            python3 - "$RUNNER_TEMP/ffmpeg-verification.log" <<'PY'
          import pathlib, sys
          message = pathlib.Path(sys.argv[1]).read_text()[-8000:]
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit "$status"
          fi
          # Verifies packaging and a sandboxed launch; GUI/CoreML need separate checks.

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: ${{ runner.temp }}/myUpscaler-build.log
          if-no-files-found: ignore
