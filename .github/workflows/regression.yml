name: Regression tests

on:
  pull_request:
    paths: &regression-paths
      - 'myUpscaler/**'
      - 'backend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'rust-toolchain.toml'
      - '.github/actions/**'
      - '.github/workflows/regression.yml'
  push:
    branches: [main]
    paths: *regression-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    # The Rust filter chain through the app, Apple media APIs on generated clips and the Metal kernels, on one
    # macOS runner, running side by side.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-macos
        with: { require-gpu: 'true' }
      - uses: ./.github/actions/rust-backend-macos
      - name: Build the test-media generator once
        run: |
          bash tests/fixtures/build.sh "$RUNNER_TEMP/make-test-media"
          echo "MAKE_TEST_MEDIA=$RUNNER_TEMP/make-test-media" >> "$GITHUB_ENV"
      - run: >-
          bash scripts/run-parallel.sh
          tests/test-finishing-strengths.sh tests/metal-kernels/run.sh
          tests/apple-api/run.sh tests/apple-api/run-orientation.sh
          tests/apple-api/run-audio.sh tests/apple-api/run-timing.sh
          tests/test-timeline.sh
