[package]
name = "myupscaler"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "myUpscaler's cross-platform desktop app: a Slint interface on the Rust processing backend."
publish = false

[[bin]]
name = "myupscaler"
path = "src/main.rs"

[dependencies]
up60p = { path = "../backend" }
up60p-gpu = { path = "../gpu" }
slint = { version = "1.18", features = ["unstable-winit-030"] }
cpal = "0.15"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSToolbar", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSString", "NSGeometry"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
i-slint-backend-testing = "1.18"
